<!DOCTYPE html>
<html lang="id" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6f5e">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<title>HTML Vault Pro</title>
<style>
/* ===== Tema (CSS variables) ===== */
:root{--bg:#f6f5f2;--card:#fff;--text:#1d1d1f;--border:#e4e2dc;--primary:#2f6f5e;--on:#fff;--mute:#8a8a85;--red:#d64545;--ease:cubic-bezier(.32,.72,0,1)}
[data-t=dark]{--bg:#161618;--card:#222226;--text:#eee;--border:#34343a;--primary:#6fcfb0;--on:#10201a;--mute:#8d8d95}
[data-t=midnight]{--bg:#000;--card:#111;--text:#f2f2f2;--border:#262626;--primary:#8ab4ff;--on:#001029;--mute:#808080}
[data-t=cream]{--bg:#f3ead8;--card:#fbf5e8;--text:#3b3226;--border:#e1d4b8;--primary:#9a5b2e;--on:#fff;--mute:#9c8f78}
[data-t=forest]{--bg:#12201a;--card:#1b2e25;--text:#e4f0e8;--border:#2b4538;--primary:#7ed39a;--on:#0b1a12;--mute:#82a08f}
[data-t=ocean]{--bg:#eaf3fb;--card:#fff;--text:#0f2740;--border:#cfe0f0;--primary:#1766b3;--on:#fff;--mute:#7d96ad}
[data-t=sunset]{--bg:#fff1e6;--card:#fffaf5;--text:#3a2216;--border:#f3d6c0;--primary:#e0561f;--on:#fff;--mute:#b08f7a}
[data-t=dracula]{--bg:#282a36;--card:#343746;--text:#f8f8f2;--border:#44475a;--primary:#bd93f9;--on:#1d1f29;--mute:#8b90ab}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;max-width:440px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg);transition:background .3s}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);opacity:0;transform:translateX(6%);pointer-events:none;visibility:hidden;transition:transform .3s var(--ease),opacity .3s var(--ease),visibility 0s .3s;background:var(--bg)}
.pg.on{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:transform .3s var(--ease),opacity .3s var(--ease)}
#p-preview{position:fixed;padding:0;background:#222}
.hd{display:flex;align-items:center;gap:8px;padding:12px 14px;position:relative}
.hd b{font-size:19px;letter-spacing:-.3px}.hd small{display:block;color:var(--mute);font-size:12px}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;color:var(--text);transition:background .2s}
.ib:active,.ib.act{background:var(--border)}
.bt{padding:10px 16px;border-radius:14px;background:var(--border);font-weight:500}
.bt.pr{background:var(--primary);color:var(--on)}.bt.dg{background:var(--red);color:#fff}
input,select{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:9px 12px;min-width:0;outline:none}
input:focus{border-color:var(--primary)}
#q{flex:1;max-width:150px}
mark{background:var(--primary);color:var(--on);border-radius:4px;padding:0 2px}
#menu{position:absolute;right:12px;top:56px;z-index:50;min-width:190px;padding:6px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:20px;box-shadow:0 18px 40px rgba(0,0,0,.2);opacity:0;transform:translateY(-12px);pointer-events:none;transition:transform .3s var(--ease),opacity .3s var(--ease)}
#menu.on{opacity:1;transform:none;pointer-events:auto}
.mi{display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;border-radius:14px;text-align:left}
.mi:active,.mi.cur{background:var(--border)}
.bar{display:flex;gap:6px;padding:0 14px 8px;align-items:center;overflow-x:auto;scrollbar-width:none}
#crumb{padding:0 14px 6px;color:var(--mute);font-size:13px;display:flex;flex-wrap:wrap;gap:4px}
#crumb a{cursor:pointer;color:var(--primary)}
#list{flex:1;overflow:auto;padding:4px 14px 90px;display:grid;gap:8px;align-content:start}
#list.grid{grid-template-columns:1fr 1fr}
.it{display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.04);cursor:pointer;user-select:none;transition:transform .2s var(--ease)}
.it:active{transform:scale(.97)}.it.drop{outline:2px dashed var(--primary)}
.grid .it{flex-direction:column;align-items:flex-start}
.it .nm{font-weight:500;word-break:break-all}.it small{color:var(--mute);font-size:12px}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--bg);color:var(--primary)}
.fd .lid{transition:transform .3s var(--ease);transform-origin:3px 20px}.it:active .lid{transform:rotate(-12deg)}
.emp{grid-column:1/-1;text-align:center;color:var(--mute);padding:50px 0}.emp svg{width:96px;height:96px;stroke-width:1;margin-bottom:8px}
.ov{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);display:flex;align-items:flex-end}
.ov.on{opacity:1;pointer-events:auto}
#shc{width:100%;background:var(--card);border-radius:28px 28px 0 0;padding:8px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s var(--ease);max-height:85%;overflow:auto}
#sh.on #shc{transform:none}
.gr{height:24px;display:grid;place-items:center;touch-action:none;cursor:grab}.gr::after{content:"";width:38px;height:4px;border-radius:9px;background:var(--border)}
#shc h3{padding:0 6px}#shc small{display:block;padding:0 6px 8px;color:var(--mute)}
.si{display:flex;gap:14px;align-items:center;width:100%;padding:13px 8px;border-radius:14px;text-align:left}.si:active{background:var(--border)}.si.dg{color:var(--red)}
#md{align-items:center;justify-content:center;padding:20px;z-index:70}
.mc{width:100%;max-width:340px;background:var(--card);border-radius:24px;padding:20px;display:grid;gap:12px;transform:scale(.94);transition:transform .3s var(--ease)}
#md.on .mc{transform:none}.mc .row{display:flex;gap:8px;justify-content:flex-end}
#toast{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:90;padding:10px 18px;border-radius:99px;background:var(--text);color:var(--bg);opacity:0;pointer-events:none;transition:transform .3s var(--ease),opacity .3s var(--ease);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.e{background:var(--red);color:#fff}
.fab{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:20px;background:var(--primary);color:var(--on);display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.tl{display:flex;gap:2px;padding:0 10px 6px;overflow-x:auto;scrollbar-width:none}
#cnt{font-size:12px;color:var(--mute);flex:1}
#dot{width:9px;height:9px;border-radius:9px;background:#3fb950}#dot.u{background:#e3b341}
.ew{flex:1;display:flex;margin:0 10px;border:1px solid var(--border);border-radius:18px;overflow:hidden;background:var(--card);min-height:0}
#gut{padding:10px 6px 10px 8px;text-align:right;color:var(--mute);white-space:pre;overflow:hidden;user-select:none;border-right:1px solid var(--border)}
#ed,#gut{font:var(--efs,14px)/1.55 "JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace}
#ed{flex:1;border:0;outline:0;resize:none;background:transparent;padding:10px;white-space:pre;overflow:auto;tab-size:var(--etab,2)}
#ed.wr{white-space:pre-wrap;word-break:break-word}.wr~#gut{display:none}
.bb{display:flex;gap:6px;padding:10px;justify-content:center}.bb .bt{flex:1;font-size:13px;padding:10px 6px}
#fw{flex:1;display:grid;justify-items:center;overflow:auto}
#fr{width:100%;height:100%;border:0;background:#fff;transform-origin:top center;transition:width .3s var(--ease)}
#pbtn{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top));transform:translateX(-50%);z-index:9;width:46px;height:28px;border-radius:14px;display:grid;place-items:center;opacity:.5;color:var(--text);background:color-mix(in srgb,var(--card) 70%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .2s}
#pbtn:active{opacity:1}
#pmb{position:absolute;inset:0;z-index:7;display:none}
#pmb.on{display:block}
#pmn{position:absolute;left:50%;top:calc(44px + env(safe-area-inset-top));transform:translate(-50%,-10px);z-index:8;min-width:250px;padding:8px;border-radius:20px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);box-shadow:0 18px 40px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:transform .28s var(--ease),opacity .28s var(--ease)}
#pmn.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#pmn .r{display:flex;gap:6px;margin-bottom:6px}
#pmn .r:last-child{margin-bottom:0}
#pmn .pi{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;font-size:11px;text-align:center;color:var(--text);transition:background .2s}
#pmn .pi:active,#pmn .pi.on{background:var(--border)}
#cons{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:42%;overflow:auto;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border);font:12px/1.5 ui-monospace,Menlo,monospace;transform:translateY(100%);transition:transform .3s var(--ease)}
#cons.on{transform:none}
#cons .chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600}
#cons .cl{padding:4px 0;border-bottom:1px solid var(--border);word-break:break-all}
#cons .cl.error{color:var(--red)}
#snv{position:absolute;right:0;top:0;bottom:0;width:230px;z-index:8;padding:calc(18px + env(safe-area-inset-top)) 10px 10px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-left:1px solid var(--border);color:var(--text);transform:translateX(100%);transition:transform .3s var(--ease)}
#snv.on{transform:none}
#snb{position:absolute;inset:0;z-index:7;display:none}#snb.on{display:block}
#perr{position:absolute;left:10px;right:10px;bottom:14px;z-index:5;padding:12px;border-radius:16px;background:var(--red);color:#fff;font-size:13px;display:none}
.sc{flex:1;overflow:auto;padding:0 14px 30px;display:grid;gap:12px;align-content:start}
.cd{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:14px;display:grid;gap:10px}
.cd h4{font-size:14px}.rw{display:flex;align-items:center;gap:10px;justify-content:space-between}
.th{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{height:46px;border-radius:14px;border:2px solid var(--border);display:grid;place-items:center;font-size:10px;font-weight:600}.sw.on{border-color:var(--primary)}
.ub{height:8px;border-radius:9px;background:var(--border);overflow:hidden}.ub i{display:block;height:100%;background:var(--primary);width:0;transition:width .4s var(--ease)}
.lg{font:12px/1.5 ui-monospace,Menlo,monospace;padding:8px 4px;border-bottom:1px solid var(--border);word-break:break-all}.lg span{color:var(--mute)}.lg.error{color:var(--red)}
.tabs{display:flex;gap:6px;padding:0 14px 8px}.tabs .bt.pr{background:var(--primary)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--primary)}
</style>
</head>
<body>
<div id="app">
 <section class="pg on" id="p-home">
  <div class="hd"><div><b>Vault</b><small id="n-files"></small></div><span class="sp"></span><input id="q" placeholder="Cari file"><button class="ib mb" data-a="menu" aria-label="Menu"></button></div>
  <div id="crumb"></div>
  <div class="bar">
   <button class="bt" data-a="imp" id="b-imp"></button><button class="bt" data-a="mkdir" id="b-dir"></button>
   <select id="sort"><option value="new">Terbaru</option><option value="old">Terlama</option><option value="az">Nama A-Z</option><option value="za">Nama Z-A</option><option value="size">Ukuran terbesar</option><option value="fav">Favorit di atas</option></select>
   <button class="ib" data-a="view" id="b-view"></button>
  </div>
  <div id="list"></div>
  <button class="fab" data-a="new" aria-label="File baru"></button>
 </section>
 <section class="pg" id="p-editor">
  <div class="hd" style="padding-bottom:4px"><span id="dot"></span><span id="cnt"></span><button class="ib mb" data-a="menu" aria-label="Menu"></button></div>
  <div class="tl" id="tl"></div>
  <div class="ew"><div id="gut"></div><textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Tulis atau tempel HTML di sini"></textarea></div>
  <div class="bb"><button class="bt pr" data-a="save">Simpan ke Vault</button><button class="bt" data-a="saveas">Simpan baru</button><button class="bt" data-a="run">Jalankan</button></div>
 </section>
 <section class="pg" id="p-preview">
  <button id="pbtn" aria-label="Menu preview"></button>
  <div id="pmb"></div>
  <div id="pmn"></div>
  <div id="cons"></div>
  <div id="fw"><iframe id="fr" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe></div>
  <div id="perr"></div><div id="snb"></div><nav id="snv"></nav>
 </section>
 <section class="pg" id="p-settings"></section>
 <section class="pg" id="p-log"></section>
 <div id="menu"></div>
 <div class="ov" id="sh"><div id="shc"></div></div>
 <div class="ov" id="md"></div>
 <div id="toast"></div>
 <input type="file" id="fin" accept=".html,.htm,text/html" multiple hidden>
 <input type="file" id="rin" accept=".json" hidden>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const kb=n=>n<1024?n+" B":(n/1024).toFixed(1)+" KB";
const dt=t=>new Date(t).toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const hl=(s,q)=>{s=esc(s);return q?s.replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),m=>"<mark>"+m+"</mark>"):s};
const vib=()=>{try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}};
const P={home:"M3 11l9-8 9 8M5 10v10h14V10",eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6",code:"M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14",set:"M4 7h9M17 7h3M4 17h3M11 17h9M15 5a2 2 0 100 4 2 2 0 000-4M9 15a2 2 0 100 4 2 2 0 000-4",term:"M4 5h16v14H4zM8 10l3 2-3 2M13 15h3",db:"M4 6c0-2.5 16-2.5 16 0s-16 2.5-16 0v12c0 2.5 16 2.5 16 0V6",more:"M12 5.5v.01M12 12v.01M12 18.5v.01",plus:"M12 5v14M5 12h14",folder:"M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z",file:"M6 3h8l5 5v13H6zM14 3v5h5M9 13h6M9 17h6",copy:"M9 9h11v11H9zM5 15V4h11",clip:"M9 4h6v3H9zM7 5H5v16h14V5h-2",trash:"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13",star:"M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z",undo:"M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3",redo:"M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3",down:"M12 4v12M7 11l5 5 5-5M5 20h14",wrap:"M4 6h16M4 12h13a3 3 0 010 6H10M12 16l-2 2 2 2",play:"M7 4l13 8-13 8z",reload:"M20 12a8 8 0 11-3-6.2M20 4v5h-5",dev:"M7 3h10v18H7zM11 18h2",ext:"M14 4h6v6M20 4l-9 9M18 14v6H4V6h6",grid:"M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",list:"M4 6h16M4 12h16M4 18h16",edit:"M4 20h4L19 9l-4-4L4 16zM13 7l4 4",sel:"M4 4h16v16H4zM8 12l3 3 5-6",info:"M12 3a9 9 0 100 18 9 9 0 000-18M12 11v5M12 8v.01"};
const ic=n=>'<svg viewBox="0 0 24 24"><path d="'+P[n]+'"/></svg>';
const NAV=[["home","Beranda","home"],["preview","Preview","eye"],["editor","Kode / Editor","code"],["settings","Setting","set"],["log","Log","term"]];
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ST=Object.assign({theme:"light",fs:14,tab:2,autosave:true,autoclose:true,wrap:false,remember:false,lastFolder:null,view:"list"},ls.get("settings",{}));
const saveST=()=>ls.set("settings",ST);
function applyST(){document.documentElement.dataset.t=ST.theme;document.documentElement.style.setProperty("--efs",ST.fs+"px");document.documentElement.style.setProperty("--etab",ST.tab);ed.classList.toggle("wr",ST.wrap)}
let db;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open("htmlvault",1);r.onupgradeneeded=()=>{["files","folders","logs"].forEach(s=>r.result.createObjectStore(s,{keyPath:"id"}))};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("DB diblokir"))});
const tx=(s,m,f)=>new Promise((res,rej)=>{const t=db.transaction(s,m);let o;try{o=f(t.objectStore(s))}catch(e){return rej(e)}t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
const dbAll=s=>tx(s,"readonly",o=>o.getAll());
const dbPut=async(s,v)=>{try{return await tx(s,"readwrite",o=>o.put(v))}catch(e){toast(e&&e.name==="QuotaExceededError"?"Penyimpanan penuh":"Gagal menyimpan","e");throw e}};
const dbDel=(s,k)=>tx(s,"readwrite",o=>o.delete(k));
const dbClear=s=>tx(s,"readwrite",o=>o.clear());
let files=[],folders=[],logs=[];
async function refresh(){[files,folders,logs]=await Promise.all([dbAll("files"),dbAll("folders"),dbAll("logs")]);logs.sort((a,b)=>b.timestamp-a.timestamp)}
function log(type,message,fileName){const l={id:uid(),type,message:String(message),fileName:fileName||"",timestamp:Date.now()};logs.unshift(l);dbPut("logs",l).catch(()=>{})}
const S={page:"home",folder:null,q:"",openId:null,lt:"save",lq:"",dirty:false,dev:0,deferred:null,prev:null, cons:false};
const gf=id=>files.find(f=>f.id===id);
const path=id=>{const a=[];while(id){const f=folders.find(x=>x.id===id);if(!f)break;a.unshift(f.name);id=f.parentId}return a};
let tt;function toast(m,t){const e=$("#toast");e.textContent=m;e.className="on "+(t||"");clearTimeout(tt);tt=setTimeout(()=>e.className="",2600)}
const md=$("#md"),sh=$("#sh"),shc=$("#shc");
function modal(title,o={}){return new Promise(r=>{md.innerHTML='<div class="mc"><h3>'+esc(title)+'</h3>'+(o.msg?'<p>'+esc(o.msg)+'</p>':'')+(o.input?'<input id="mi" value="'+esc(o.val||"")+'">':'')+'<div class="row"><button class="bt" data-m="0">Batal</button><button class="bt '+(o.danger?"dg":"pr")+'" data-m="1">'+(o.ok||"OK")+'</button></div></div>';md.classList.add("on");const i=$("#mi");if(i){i.focus();i.select();i.onkeydown=e=>{if(e.key==="Enter")md.querySelector('[data-m="1"]').click()}}
 md.onclick=e=>{const b=e.target.closest("[data-m]");if(!b&&e.target!==md)return;md.classList.remove("on");r(b&&b.dataset.m==="1"?(i?i.value.trim()||null:true):null)}})}
function sheet(title,sub,items){shc.innerHTML='<div class="gr"></div><h3>'+esc(title)+'</h3><small>'+sub+'</small>'+items.map((x,i)=>'<button class="si '+(x.d?"dg":"")+'" data-s="'+i+'">'+ic(x.i)+x.l+'</button>').join("");sh.classList.add("on");sh._it=items}

/* ===== PWA - Service Worker & Back Lock khusus Preview (hanya di mode PWA) ===== */
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone || document.referrer.includes('android-app://');

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').then(()=>console.log('SW registered')).catch(e=>console.warn('SW fail', e));
  });
}

// State tambahan untuk PWA back lock
S.allowBackPWA = false;

const _goOriginal = go;
go = function(p){
  const wasPv = S.page==="preview";
  const nowStandalone = isStandalone();
  
  // Jika keluar dari preview lewat UI di mode PWA, izinkan 1x back untuk bersih-bersih
  if(wasPv && p!=="preview" && nowStandalone && S.blockBackPWA){
    S.blockBackPWA = false;
    S.allowBackPWA = true;
    try{ history.back(); }catch(e){}
  }

  S.page = p;
  closeMenu(); closeSnv();
  document.querySelectorAll(".pg").forEach(e=>e.classList.toggle("on",e.id==="p-"+p));
  document.querySelectorAll(".mi[data-p]").forEach(m=>m.classList.toggle("cur",m.dataset.p===p&&m.textContent!=="Info Storage"));
  if(p==="home")renderList();if(p==="settings")renderSet();if(p==="log")renderLog();if(p==="editor")updCount();if(p==="preview")runPreview(false);
  ls.set("lastPage",p);

  if(p==="preview" && !wasPv && nowStandalone){
    S.blockBackPWA = true;
    try{ history.pushState({previewTrap:true, t:Date.now()},"",location.href); }catch(e){}
  }
};

// Override popstate clean dengan yang PWA-aware
window.addEventListener("popstate", (e)=>{
  if(S.allowBackPWA){
    S.allowBackPWA = false;
    S.blockBackPWA = false;
    return;
  }
  if(S.page==="preview" && S.blockBackPWA && isStandalone()){
    try{ history.pushState({previewTrap:true, t:Date.now()},"",location.href); }catch(err){}
    toast("Preview terkunci. Pakai menu ⋯ > Beranda / Kode untuk keluar.");
    vib();
  }
});
