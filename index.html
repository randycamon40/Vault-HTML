<!DOCTYPE html>
<html lang="id" data-t="light">
<head>
<meta charset="utf-8">

<title>HTML Vault Pro</title>
<style>
/* ===== Design system v2: mobile-first, 8 tema ===== */
:root{--bg:#eef1f5;--card:#fff;--text:#14181f;--bd:#dde2ea;--pr:#0b8f8c;--on:#fff;--mu:#6b7685;--red:#d93a3a;--ease:cubic-bezier(.32,.72,0,1);--r:22px;
 --ui:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;--mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);--dock:calc(78px + var(--sb));--efs:14px;--etab:2}
[data-t=dark]{--bg:#0e1217;--card:#171d25;--text:#e8edf3;--bd:#26303b;--pr:#38d0c8;--on:#00201f;--mu:#8593a3}
[data-t=midnight]{--bg:#000;--card:#0c0c0e;--text:#f4f4f5;--bd:#1d1d21;--pr:#ff7a59;--on:#200800;--mu:#77777f}
[data-t=cream]{--bg:#f1ebe0;--card:#fbf8f2;--text:#2b2620;--bd:#ddd2bf;--pr:#3d5a80;--on:#fff;--mu:#8a7f6d}
[data-t=forest]{--bg:#0d1a14;--card:#14261d;--text:#e3f1e8;--bd:#213a2d;--pr:#9be15d;--on:#0d1a06;--mu:#7fa08c}
[data-t=ocean]{--bg:#e6f1fa;--card:#fff;--text:#0b2239;--bd:#c8dcec;--pr:#0a5fd6;--on:#fff;--mu:#6a859d}
[data-t=sunset]{--bg:#fff0e8;--card:#fffaf6;--text:#2e1a14;--bd:#f0d3c4;--pr:#d6336c;--on:#fff;--mu:#a58477}
[data-t=dracula]{--bg:#1e1f29;--card:#282a36;--text:#f8f8f2;--bd:#3a3d50;--pr:#bd93f9;--on:#1e1033;--mu:#8b90ab}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font:15px/1.4 var(--ui);color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;border-radius:16px;touch-action:manipulation;transition:transform .3s var(--ease),background .2s,opacity .2s}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
input,select,textarea{outline:0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
mark{background:var(--pr);color:var(--on);border-radius:4px;padding:0 2px}
/* user-select: hanya chrome UI dimatikan; editor, log, console, teks info tetap bisa dipilih */
.hd,.dock,.bar,.it,.bt,.ib,.fab,.si,.mi,#crumb,#pmn,.pgl,.tl,.sw,.chip{-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0 0 auto 0;height:100dvh;overflow:hidden}
.pg{position:absolute;inset:0;display:none;flex-direction:column;min-height:0;padding-bottom:var(--dock);background:var(--bg)}
.pg.on{display:flex}
.hd{display:flex;align-items:center;gap:6px;padding:calc(var(--st) + 12px) 14px 8px 20px;flex:none}
.hd .tt{flex:1;min-width:0}.hd b{display:block;font-size:26px;letter-spacing:-.03em;line-height:1.1}.hd small{color:var(--mu);font-size:12.5px}
.sp{flex:1}
.ib{width:44px;height:44px;display:grid;place-items:center;color:var(--mu);border-radius:16px;flex:none}
.ib:active,.ib.on{background:color-mix(in srgb,var(--pr) 16%,transparent);color:var(--pr)}
.bt{min-height:44px;padding:0 16px;border-radius:16px;background:var(--card);border:1px solid var(--bd);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.bt.pr{background:var(--pr);color:var(--on);border-color:transparent}.bt.dg{color:var(--red)}.bt svg{width:18px;height:18px}
input,select{min-height:44px;padding:0 14px;border-radius:16px;border:1px solid var(--bd);background:var(--card);font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--pr)}
/* Home */
#q{margin:2px 16px 8px;width:calc(100% - 32px);padding-left:44px;background:var(--card) no-repeat 14px center/18px}
#crumb{display:flex;gap:2px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:0 16px 6px;font-size:13px;color:var(--mu);white-space:nowrap}
#crumb a{padding:10px 8px;border-radius:12px;cursor:pointer}#crumb a:last-of-type{color:var(--text);font-weight:700}
.bar{display:flex;gap:8px;padding:0 16px 10px;align-items:center}.bar select{flex:1;min-width:0;font-size:14px}
#list{flex:1;overflow:auto;padding:2px 16px 100px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
#list.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}
.it{display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 8px 10px 12px;border-radius:var(--r);background:var(--card);border:1px solid var(--bd);box-shadow:0 1px 0 color-mix(in srgb,var(--text) 4%,transparent),0 8px 24px -14px color-mix(in srgb,var(--text) 35%,transparent);cursor:pointer;transition:transform .3s var(--ease),border-color .2s}
.it:active{transform:scale(.98)}.it.drop{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,var(--card))}.it.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,var(--card))}
.it .bd{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;font:700 11px var(--mono);letter-spacing:.02em;color:var(--pr);background:color-mix(in srgb,var(--pr) 14%,transparent)}
.it .bd.fo{background:color-mix(in srgb,var(--pr) 20%,transparent)}.it .bd svg{width:22px}
.it .mt{flex:1;min-width:0}.it .nm{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it small{color:var(--mu);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .go{color:var(--pr)}.it .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;margin-right:8px;flex:none}.it.sel .ck{background:var(--pr);border-color:var(--pr);color:var(--on)}.ck svg{width:14px;stroke-width:3}
#list.grid .it{flex-direction:column;align-items:flex-start;padding:14px 12px 8px;gap:8px}#list.grid .go,#list.grid .it .ib{align-self:flex-end;margin-top:-4px}#list.grid .mt{width:100%}
.emp{grid-column:1/-1;text-align:center;color:var(--mu);padding:56px 20px;margin:auto}.emp svg{width:104px;height:104px;stroke-width:1;margin-bottom:10px;color:var(--pr);opacity:.85}.emp b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.fab{position:absolute;right:18px;bottom:calc(var(--dock) + 14px);width:60px;height:60px;border-radius:22px;background:var(--pr);color:var(--on);display:grid;place-items:center;box-shadow:0 14px 30px -8px color-mix(in srgb,var(--pr) 60%,transparent);z-index:5}.fab svg{width:26px}
#selbar{position:absolute;left:14px;right:14px;bottom:calc(var(--dock) + 10px);z-index:12;display:none;align-items:center;gap:2px;padding:6px 10px 6px 18px;border-radius:26px;background:var(--text);color:var(--bg);box-shadow:0 14px 34px -8px rgba(0,0,0,.5)}#selbar.on{display:flex}#selbar span{flex:1;font-weight:650}#selbar .ib{color:var(--bg)}
/* Dock */
#dock{position:absolute;left:12px;right:12px;bottom:calc(var(--sb) + 10px);height:62px;display:flex;gap:2px;padding:6px;border-radius:28px;z-index:20;background:color-mix(in srgb,var(--card) 76%,transparent);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--bd);box-shadow:0 18px 40px -14px color-mix(in srgb,var(--text) 45%,transparent);transition:transform .4s var(--ease);max-width:520px;margin:auto}
#dock button{flex:1;display:grid;place-items:center;align-content:center;font-size:10.5px;color:var(--mu);border-radius:22px;min-width:44px;font-weight:600}#dock button.on{background:color-mix(in srgb,var(--pr) 18%,transparent);color:var(--pr)}
body[data-p=preview] #dock,body.kbo #dock{transform:translateY(170%)}
body[data-p=preview] .pg{padding-bottom:0}
/* Editor */
.tl{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 12px 6px;flex:none}
.ew{flex:1;min-height:0;display:flex;margin:0 14px;border-radius:var(--r);background:var(--card);border:1px solid var(--bd);overflow:hidden}
#gut{padding:12px 6px 12px 10px;font:var(--efs)/1.6 var(--mono);color:var(--mu);text-align:right;white-space:pre;overflow:hidden;background:color-mix(in srgb,var(--bd) 35%,transparent);min-width:38px;opacity:.9}
#ed{flex:1;min-width:0;border:0;background:transparent;resize:none;padding:12px;font:var(--efs)/1.6 var(--mono);white-space:pre;overflow:auto;tab-size:var(--etab);-moz-tab-size:var(--etab);color:var(--text)}
#ed.wr{white-space:pre-wrap;word-wrap:break-word}.wr~*{}.ew:has(#ed.wr) #gut{display:none}
#dot{width:10px;height:10px;border-radius:50%;background:var(--pr);flex:none;transition:background .3s}#dot.u{background:#f0a020;box-shadow:0 0 0 4px color-mix(in srgb,#f0a020 25%,transparent)}
#cnt{flex:1;font:12px var(--mono);color:var(--mu);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;-webkit-user-select:text;user-select:text}
.ebb{display:flex;gap:8px;padding:10px 14px 12px;flex:none}.ebb .bt{flex:none}.ebb .bt.pr{flex:1}
/* Preview */
#fw{flex:1;display:grid;justify-items:center;overflow:auto;background:repeating-conic-gradient(color-mix(in srgb,var(--text) 5%,transparent) 0 25%,transparent 0 50%) 0 0/22px 22px}
#fr{width:100%;height:100%;border:0;background:#fff;transition:width .4s var(--ease)}
#plive{position:absolute;left:12px;top:calc(var(--st) + 10px);z-index:9;display:flex;align-items:center;gap:8px;max-width:calc(50% - 40px);padding:7px 13px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.04em;background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);pointer-events:none}
#plive::before{content:"";width:8px;height:8px;border-radius:50%;background:#2fbf71;animation:pd 1.6s infinite;flex:none}#plive small{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mu)}@keyframes pd{50%{opacity:.35}}
#pbtn{position:absolute;left:50%;top:calc(var(--st) + 8px);transform:translateX(-50%);z-index:9;width:64px;height:36px;border-radius:99px;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);opacity:.75}
#pmb,#snb{position:absolute;inset:0;z-index:7;display:none}#pmb.on,#snb.on{display:block}
#pmn{position:absolute;left:50%;top:calc(var(--st) + 52px);width:min(340px,calc(100% - 24px));transform:translate(-50%,-12px) scale(.96);opacity:0;pointer-events:none;z-index:8;padding:8px;border-radius:26px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--bd);box-shadow:0 24px 50px -14px rgba(0,0,0,.45);transition:transform .35s var(--ease),opacity .25s}
#pmn.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#pmn .r{display:flex;gap:4px}#pmn .r+.r{margin-top:4px}
#pmn .pi{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;border-radius:18px}#pmn .pi.on{background:color-mix(in srgb,var(--pr) 18%,transparent);color:var(--pr)}
#cons{position:absolute;left:10px;right:10px;bottom:calc(var(--sb) + 10px);max-height:42%;overflow:auto;z-index:6;padding:0 12px 10px;border-radius:24px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--bd);box-shadow:0 18px 40px -12px rgba(0,0,0,.4);font:12px/1.5 var(--mono);display:none;-webkit-user-select:text;user-select:text}#cons.on{display:block}
#cons .chead{position:sticky;top:0;background:inherit;display:flex;justify-content:space-between;align-items:center;font:700 13px var(--ui);padding:8px 0 6px}
#cons .cl{padding:4px 0;border-bottom:1px solid var(--bd);white-space:pre-wrap;word-break:break-word}.cl.error,.lg.error{color:var(--red)}
#perr{position:absolute;left:12px;right:12px;bottom:calc(var(--sb) + 14px);z-index:5;padding:12px 16px;border-radius:18px;background:var(--red);color:#fff;font-size:13px;display:none;-webkit-user-select:text;user-select:text}
#edge{position:absolute;right:0;top:80px;bottom:0;width:22px;z-index:6;touch-action:none}
#snv{position:absolute;right:0;top:0;bottom:0;width:250px;z-index:8;padding:calc(var(--st) + 18px) 12px 14px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-left:1px solid var(--bd);transform:translateX(104%);transition:transform .4s var(--ease)}#snv.on{transform:none}
.mi{display:flex;align-items:center;gap:14px;width:100%;min-height:48px;padding:0 14px;text-align:left;font-weight:600;border-radius:16px}.mi:active,.mi.cur{background:color-mix(in srgb,var(--pr) 16%,transparent);color:var(--pr)}
/* Settings, Log */
.sc{flex:1;overflow:auto;padding:4px 16px 100px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.cd{padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--bd);display:flex;flex-direction:column;gap:10px}.cd h4{font-size:13px;color:var(--mu);font-weight:700}
.rw{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:44px}.rw .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw input[type=checkbox]{appearance:none;-webkit-appearance:none;width:52px;height:32px;min-height:0;padding:0;border-radius:99px;background:var(--bd);position:relative;transition:background .25s;border:0;flex:none}
.rw input[type=checkbox]::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .3s var(--ease)}.rw input[type=checkbox]:checked{background:var(--pr)}.rw input[type=checkbox]:checked::after{transform:translateX(20px)}
input[type=range]{padding:0;min-height:32px;flex:1;accent-color:var(--pr);border:0;background:none}
.th{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sw{min-height:64px;border-radius:18px;font-size:11px;font-weight:700;border:2px solid transparent;display:grid;place-items:end center;padding:6px}.sw.on{border-color:var(--pr)}
.ub{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}.ub i{display:block;height:100%;width:0;background:var(--pr);border-radius:9px;transition:width .8s var(--ease)}
.pgl{display:flex;gap:6px;padding:0 16px 8px;flex:none}.pgl .bt{flex:1}
.lg{padding:10px 2px;border-bottom:1px solid var(--bd);font:12px/1.5 var(--mono);word-break:break-word;-webkit-user-select:text;user-select:text}.lg span{color:var(--mu)}.lg.save{color:var(--pr)}
/* Overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;opacity:0;transition:opacity .25s}.ov.on{display:flex;opacity:1}
#sh,#bmd,#pemd{align-items:flex-end;justify-content:center}#md{align-items:center;justify-content:center;padding:20px;z-index:70}#qo{align-items:flex-start;justify-content:center;padding:calc(var(--st) + 14px) 12px;z-index:65}
#shc,.bmc{width:100%;max-width:560px;max-height:88dvh;overflow:auto;padding:0 16px calc(16px + var(--sb));background:var(--card);border-radius:30px 30px 0 0;display:flex;flex-direction:column;gap:8px;animation:up .45s var(--ease)}@keyframes up{from{transform:translateY(100%)}}
.gr{height:30px;display:grid;place-items:center;touch-action:none;cursor:grab;flex:none}.gr::after{content:"";width:42px;height:5px;border-radius:9px;background:var(--bd)}
#shc h3,.bmhd{font-size:18px;letter-spacing:-.01em}#shc>small{color:var(--mu);margin-top:-6px;display:block}
.si{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 14px;border-radius:18px;font-weight:600;text-align:left;width:100%}.si:active{background:color-mix(in srgb,var(--pr) 14%,transparent)}.si svg{color:var(--pr)}.si.dg,.si.dg svg{color:var(--red)}
.mc{width:100%;max-width:380px;padding:22px;border-radius:28px;background:var(--card);display:flex;flex-direction:column;gap:12px;animation:pop .4s var(--ease)}@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}}
.mc p{color:var(--mu);white-space:pre-line;word-break:break-word;-webkit-user-select:text;user-select:text}.mc .er{color:var(--red);font-size:13px;min-height:0}.mc .row{display:flex;gap:8px;justify-content:flex-end}.mc .row .bt{flex:1}
.bmc{padding-top:4px}.bmhd{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding-left:4px}
#bm-ta,#pemd-ta{width:100%;height:190px;max-height:42vh;padding:12px;background:var(--bg);border:1px solid var(--bd);border-radius:18px;font:12.5px/1.5 var(--mono);resize:vertical;white-space:pre;overflow:auto}#pemd-ta{height:260px;white-space:pre-wrap}
.bmrow{display:flex;gap:6px}.bmrow .bt.pr{flex:1}.bmrow .bt{padding:0 12px;font-size:13px}
.bmst{padding:11px 14px;text-align:center;font-size:13px;background:var(--bg);border:1px solid var(--bd);border-radius:16px;color:var(--mu)}.bmst.err{color:var(--red);border-color:var(--red)}.bmst.ok{color:var(--pr);border-color:var(--pr)}
.bmdt{display:none;max-height:150px;overflow-y:auto;background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:6px}.bmdt .bi{display:flex;gap:8px;padding:5px 8px;font:11px/1.4 var(--mono);align-items:flex-start}
#menu{position:absolute;right:14px;top:calc(var(--st) + 64px);z-index:40;min-width:210px;padding:6px;border-radius:24px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--bd);box-shadow:0 24px 50px -14px rgba(0,0,0,.4);opacity:0;transform:translateY(-10px) scale(.96);transform-origin:top right;pointer-events:none;transition:transform .35s var(--ease),opacity .2s}#menu.on{opacity:1;transform:none;pointer-events:auto}
.qc{width:100%;max-width:560px;border-radius:28px;background:var(--card);overflow:hidden;box-shadow:0 30px 70px -10px rgba(0,0,0,.55);animation:pop .4s var(--ease)}#qi{width:100%;border:0;border-bottom:1px solid var(--bd);border-radius:0;min-height:56px;padding:0 20px;background:none}#qr{max-height:52dvh;overflow:auto;padding:6px}
#qr .si.on{background:color-mix(in srgb,var(--pr) 16%,transparent)}#qr small{margin-left:auto;color:var(--mu);font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(var(--dock) + 16px);transform:translate(-50%,20px) scale(.96);z-index:90;max-width:calc(100% - 32px);padding:13px 20px;border-radius:99px;background:var(--text);color:var(--bg);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:transform .4s var(--ease),opacity .25s;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}#toast.e{background:var(--red);color:#fff}
/* Desktop = peningkatan: split editor + preview live */
@media(min-width:900px){
 body[data-p=editor] #p-editor{right:50%;border-right:1px solid var(--bd)}
 body[data-p=editor] #p-preview{display:flex;left:50%}
 body[data-p=editor] #pbtn,body[data-p=editor] #edge{display:none}
 body[data-p=editor] #dock{right:calc(50% + 12px)}
 #list.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="app">
 <section class="pg on" id="p-home">
  <div class="hd"><div class="tt"><b>Vault</b><small id="n-files"></small></div><button class="ib" data-a="qo" id="b-qo" aria-label="Buka cepat"></button><button class="ib mb" data-a="menu" aria-label="Menu"></button></div>
  <input id="q" type="search" placeholder="Cari file" aria-label="Cari file" autocomplete="off">
  <div id="crumb"></div>
  <div class="bar">
   <button class="bt" data-a="imp" id="b-imp"></button><button class="bt" data-a="mkdir" id="b-dir"></button>
   <select id="sort" aria-label="Urutkan"><option value="new">Terbaru</option><option value="old">Terlama</option><option value="az">Nama A-Z</option><option value="za">Nama Z-A</option><option value="size">Ukuran terbesar</option><option value="fav">Favorit di atas</option></select>
   <button class="ib" data-a="view" id="b-view" aria-label="Grid atau list"></button>
  </div>
  <div id="list"></div>
  <div id="selbar"><span id="selc"></span><button class="ib" data-a="bmove" id="sb-m" aria-label="Pindah"></button><button class="ib" data-a="bexp" id="sb-e" aria-label="Ekspor"></button><button class="ib" data-a="btrash" id="sb-t" aria-label="Hapus"></button><button class="ib" data-a="bcancel" id="sb-x" aria-label="Batal"></button></div>
  <button class="fab" data-a="new" aria-label="File baru"></button>
 </section>
 <section class="pg" id="p-editor">
  <div class="hd" style="padding-bottom:6px"><span id="dot"></span><span id="cnt"></span><button class="ib" data-a="qo" id="b-qo2" aria-label="Buka cepat"></button><button class="ib mb" data-a="menu" aria-label="Menu"></button></div>
  <div class="tl" id="tl"></div>
  <div class="ew"><div id="gut"></div><textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Tulis atau tempel HTML di sini"></textarea></div>
  <div class="ebb"><button class="bt pr" data-a="save">Simpan ke Vault</button><button class="bt" data-a="saveas">Simpan baru</button><button class="bt" data-a="run">Jalankan</button></div>
 </section>
 <section class="pg" id="p-preview">
  <div id="plive">LIVE<small id="plive-name"></small></div>
  <button id="pbtn" aria-label="Menu preview"></button>
  <div id="pmb"></div><div id="pmn"></div>
  <div id="cons"></div>
  <div id="fw"><iframe id="fr" title="Preview"></iframe></div>
  <div id="perr"></div><div id="edge"></div><div id="snb"></div><nav id="snv"></nav>
 </section>
 <section class="pg" id="p-settings"></section>
 <section class="pg" id="p-log"></section>
 <nav id="dock" aria-label="Navigasi utama"></nav>
 <div id="menu"></div>
 <div class="ov" id="sh"><div id="shc"></div></div>
 <div class="ov" id="md"></div>
 <div class="ov" id="qo"><div class="qc"><input id="qi" placeholder="Cari file atau perintah…" autocomplete="off"><div id="qr"></div></div></div>
 <div class="ov" id="bmd">
  <div class="bmc"><div class="gr"></div>
   <div class="bmhd"><span>Batch Replace</span><button class="ib" id="bm-close" aria-label="Tutup"></button></div>
   <button class="bt" id="bm-prompt" title="Tap: copy prompt AI · Tahan untuk edit prompt"></button>
   <textarea id="bm-ta" placeholder="Paste hasil AI di sini. Format:&#10;&#10;CARI:&#10;[teks asli]&#10;&#10;GANTI DENGAN:&#10;[teks pengganti]&#10;&#10;Pisah tiap blok dengan ---" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
   <div class="bmrow"><button class="bt" id="bm-paste"></button><button class="bt" id="bm-check"></button><button class="bt pr" id="bm-apply"></button><button class="bt dg" id="bm-clear" aria-label="Kosongkan"></button></div>
   <div class="bmst" id="bm-st">—</div><div class="bmdt" id="bm-dt"></div>
  </div>
 </div>
 <div class="ov" id="pemd">
  <div class="bmc"><div class="gr"></div>
   <div class="bmhd"><span>Edit Prompt AI</span><button class="ib" id="pemd-close" aria-label="Tutup"></button></div>
   <textarea id="pemd-ta" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
   <div class="bmrow"><button class="bt" id="pemd-reset">Reset</button><button class="bt pr" id="pemd-save">Simpan</button></div>
  </div>
 </div>
 <div id="toast"></div>
 <input type="file" id="fin" accept=".html,.htm,text/html" multiple hidden>
 <input type="file" id="rin" accept=".json" hidden>
</div>
<script>
"use strict";
/* ============ Util ============ */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const kb=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB";
const dt=t=>new Date(t).toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const hl=(s,q)=>{s=esc(s);return q?s.replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),m=>"<mark>"+m+"</mark>"):s};
const vib=()=>{try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}};
const fuzzy=(q,s)=>{q=q.toLowerCase();s=s.toLowerCase();let i=0,sc=0,l=-2;for(const c of q){const j=s.indexOf(c,i);if(j<0)return-1;sc+=j===l+1?3:1;l=j;i=j+1}return sc-s.length*.01};
const BAD=/[\/\\:*?"<>|]/;
/* Ikon: stroke 1.5, konsisten */
const P={home:"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z",eye:"M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6",code:"m16 18 6-6-6-6M8 6l-6 6 6 6",set:"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6",term:"m4 17 6-6-6-6M12 19h8",db:"M12 8c4.4 0 8-1.3 8-3s-3.6-3-8-3-8 1.3-8 3 3.6 3 8 3zM4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3",more:"M12 12h.01M12 5h.01M12 19h.01",plus:"M12 5v14M5 12h14",folder:"M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z",file:"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7zM14 2v4a2 2 0 0 0 2 2h4",copy:"M8 8h12v12H8zM4 16V4h12",clip:"M9 4h6v3H9zM7 5H5v16h14V5h-2",trash:"M3 6h18M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V3h6v3",star:"m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z",undo:"M3 7v6h6M3 13a9 9 0 1 0 3-7",redo:"M21 7v6h-6M21 13a9 9 0 1 1-3-7",down:"M12 3v12M7 10l5 5 5-5M5 21h14",wrap:"M3 6h18M3 12h15a3 3 0 0 1 0 6h-4M16 16l-2 2 2 2M3 18h6",play:"M6 3l14 9-14 9z",reload:"M21 12a9 9 0 1 1-3-6.7M21 4v5h-5",dev:"M7 2h10a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM11 18h2",ext:"M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6",grid:"M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z",list:"M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",edit:"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z",sel:"M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9",info:"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16v-4M12 8h.01",bolt:"M13 2 3 14h9l-1 8 10-12h-9z",search:"m21 21-4.3-4.3M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z",x:"M18 6 6 18M6 6l12 12",check:"M20 6 9 17l-5-5",move:"M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20",shield:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4"};
const ic=n=>'<svg viewBox="0 0 24 24"><path d="'+P[n]+'"/></svg>';
const NAV=[["home","Vault","home"],["editor","Kode","code"],["preview","Preview","eye"],["log","Log","term"],["settings","Setting","set"]];
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const ST=Object.assign({theme:"light",fs:14,tab:2,autosave:true,autoclose:true,wrap:false,remember:false,lastFolder:null,view:"list",sameOrigin:false},ls.get("settings",{}));
const saveST=()=>ls.set("settings",ST);
const TC={light:"#eef1f5",dark:"#0e1217",midnight:"#000000",cream:"#f1ebe0",forest:"#0d1a14",ocean:"#e6f1fa",sunset:"#fff0e8",dracula:"#1e1f29"};
function applyST(){const r=document.documentElement;r.dataset.t=ST.theme;r.style.setProperty("--efs",ST.fs+"px");r.style.setProperty("--etab",ST.tab);ed.classList.toggle("wr",!!ST.wrap);
 fr.setAttribute("sandbox","allow-scripts allow-forms allow-modals"+(ST.sameOrigin?" allow-same-origin":""));
 const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=TC[ST.theme]||"#eef1f5"}

/* ============ IndexedDB (skema asli: htmlvault v1 → files, folders, logs) ============ */
let db;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open("htmlvault",1);r.onupgradeneeded=()=>{["files","folders","logs"].forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:"id"})})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("DB diblokir"))});
const tx=(s,m,f)=>new Promise((res,rej)=>{const t=db.transaction(s,m);let o;try{o=f(t.objectStore(s))}catch(e){return rej(e)}t.oncomplete=()=>res(o&&o.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
const dbAll=s=>tx(s,"readonly",o=>o.getAll());
const dbPut=async(s,v)=>{try{return await tx(s,"readwrite",o=>o.put(v))}catch(e){toast(e&&e.name==="QuotaExceededError"?"Penyimpanan penuh":"Gagal menyimpan","e");throw e}};
const dbDel=(s,k)=>tx(s,"readwrite",o=>o.delete(k));
const dbClear=s=>tx(s,"readwrite",o=>o.clear());
let files=[],folders=[],logs=[];
const LOGMAX=200;
async function refresh(){[files,folders,logs]=await Promise.all([dbAll("files"),dbAll("folders"),dbAll("logs")]);logs.sort((a,b)=>b.timestamp-a.timestamp);
 while(logs.length>LOGMAX){const o=logs.pop();dbDel("logs",o.id).catch(()=>{})}}
/* Log dibatasi 200 entri: yang terlama dibuang dari memori dan IndexedDB */
function log(type,message,fileName){const l={id:uid(),type,message:String(message).slice(0,2000),fileName:fileName||"",timestamp:Date.now()};logs.unshift(l);dbPut("logs",l).catch(()=>{});
 while(logs.length>LOGMAX){const o=logs.pop();dbDel("logs",o.id).catch(()=>{})}}
const S={page:"home",folder:null,q:"",openId:null,lt:"save",lq:"",dirty:false,dev:0,deferred:null,prev:null,cons:false,sel:new Set(),selMode:false};
const gf=id=>files.find(f=>f.id===id);
const path=id=>{const a=[];while(id){const f=folders.find(x=>x.id===id);if(!f)break;a.unshift(f.name);id=f.parentId}return a};
let tt;function toast(m,t){const e=$("#toast");e.textContent=m;e.className="on "+(t||"");clearTimeout(tt);tt=setTimeout(()=>e.className="",2600)}

/* ============ Validasi nama ============ */
function nameErr(name,parentId,selfId,kind){if(!name)return"Nama tidak boleh kosong";if(BAD.test(name))return'Tidak boleh memuat / \\ : * ? " < > |';if(name.length>120)return"Maksimal 120 karakter";
 const l=name.toLowerCase();
 if(files.some(f=>!f.isTrashed&&f.id!==selfId&&(f.folderId||null)===(parentId||null)&&f.name.toLowerCase()===l)||folders.some(f=>f.id!==selfId&&(f.parentId||null)===(parentId||null)&&f.name.toLowerCase()===l))return"Nama sudah dipakai di folder ini";return""}
function uniq(name,parentId,selfId){let n=name,i=2;while(nameErr(n,parentId,selfId)==="Nama sudah dipakai di folder ini")n=name.replace(/(\.[^.]*)?$/,m=>" ("+i+++")"+(m||""));return n}

/* ============ Modal, sheet ============ */
const md=$("#md"),sh=$("#sh"),shc=$("#shc");
function modal(title,o={}){return new Promise(r=>{md.innerHTML='<div class="mc"><h3>'+esc(title)+'</h3>'+(o.msg?'<p>'+esc(o.msg)+'</p>':'')+(o.input?'<input id="mi" value="'+esc(o.val||"")+'" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="er" id="mer"></div>':'')+'<div class="row"><button class="bt" data-m="0">'+(o.cancel===false?"Tutup":"Batal")+'</button>'+(o.cancel===false?"":'<button class="bt '+(o.danger?"dg":"pr")+'" data-m="1">'+(o.ok||"OK")+'</button>')+'</div></div>';
 md.classList.add("on");const i=$("#mi");if(i){setTimeout(()=>{i.focus();i.select()},60);i.onkeydown=e=>{if(e.key==="Enter")md.querySelector('[data-m="1"]').click()}}
 md.onclick=e=>{const b=e.target.closest("[data-m]");if(!b&&e.target!==md)return;const ok=b&&b.dataset.m==="1";
  if(ok&&i&&o.validate){const m=o.validate(i.value.trim());if(m){$("#mer").textContent=m;return}}
  md.classList.remove("on");r(ok?(i?i.value.trim()||null:true):null)}})}
function sheet(title,sub,items){shc.innerHTML='<div class="gr"></div><h3>'+esc(title)+'</h3><small>'+esc(sub)+'</small>'+items.map((x,i)=>'<button class="si '+(x.d?"dg":"")+'" data-s="'+i+'">'+ic(x.i)+esc(x.l)+'</button>').join("");sh.classList.add("on");sh._it=items}
const closeSh=()=>sh.classList.remove("on");
sh.addEventListener("click",e=>{if(e.target===sh)return closeSh();const b=e.target.closest("[data-s]");if(b&&sh._it){closeSh();vib();sh._it[+b.dataset.s].fn()}});
function dragSheet(box){let y0=null;box.addEventListener("pointerdown",e=>{if(e.target.closest(".gr")){y0=e.clientY;try{box.setPointerCapture(e.pointerId)}catch(x){}box.style.animation="none";box.style.transition="none"}});
 box.addEventListener("pointermove",e=>{if(y0!=null)box.style.transform="translateY("+Math.max(0,e.clientY-y0)+"px)"});
 const end=e=>{if(y0==null)return;const d=e.clientY-y0;y0=null;box.style.transition="";box.style.transform="";if(d>70)box.closest(".ov").classList.remove("on")};box.addEventListener("pointerup",end);box.addEventListener("pointercancel",end)}
dragSheet(shc);$$(".bmc").forEach(dragSheet);

/* ============ Menu, dock, navigasi ============ */
const menu=$("#menu");
const MENU=NAV.map(n=>'<button class="mi" data-a="go" data-p="'+n[0]+'">'+ic(n[2])+n[1]+'</button>').join("")+'<button class="mi" data-a="storage">'+ic("db")+'Info Storage</button><button class="mi" data-a="qo">'+ic("search")+'Buka cepat</button>';
menu.innerHTML=MENU;$("#dock").innerHTML=NAV.map(n=>'<button data-a="go" data-p="'+n[0]+'">'+ic(n[2])+'<span>'+n[1]+'</span></button>').join("");
$("#snv").innerHTML=NAV.map(n=>'<button class="mi" data-a="go" data-p="'+n[0]+'">'+ic(n[2])+n[1]+'</button>').join("");
$$(".mb").forEach(b=>b.innerHTML=ic("more"));$("#b-qo").innerHTML=$("#b-qo2").innerHTML=ic("search");
$("#b-imp").innerHTML=ic("down")+"Import";$("#b-dir").innerHTML=ic("folder")+"Folder";$(".fab").innerHTML=ic("plus");
$("#q").style.backgroundImage='url("data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#8a93a0" stroke-width="1.6" stroke-linecap="round"><path d="m21 21-4.3-4.3M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z"/></svg>')+'")';
$("#sb-m").innerHTML=ic("move");$("#sb-e").innerHTML=ic("down");$("#sb-t").innerHTML=ic("trash");$("#sb-x").innerHTML=ic("x");
function go(p){S.page=p;document.body.dataset.p=p;closeMenu();closeSnv();closePm();if(p!=="home")exitSel();
 $$(".pg").forEach(e=>e.classList.toggle("on",e.id==="p-"+p));
 $$("#dock [data-p],#menu [data-p],#snv [data-p]").forEach(m=>m.classList.toggle("on",m.dataset.p===p));$$("#menu [data-p],#snv [data-p]").forEach(m=>m.classList.toggle("cur",m.dataset.p===p));
 if(p==="home")renderList();if(p==="settings")renderSet();if(p==="log")renderLog();if(p==="editor"){updCount();if(wide.matches)runPreview(false)}
 if(p==="preview"){runPreview(false);$("#cons").classList.toggle("on",S.cons);if(S.cons)renderCons()}
 ls.set("lastPage",p)}
const closeMenu=()=>menu.classList.remove("on");
const closeSnv=()=>{$("#snv").classList.remove("on");$("#snb").classList.remove("on")};
const openSnv=()=>{$("#snv").classList.add("on");$("#snb").classList.add("on")};
$("#snb").onclick=closeSnv;
const wide=matchMedia("(min-width:900px)");

/* ============ Data file ============ */
const mk=(name,content,folderId)=>({id:uid(),name,content,folderId:folderId||null,size:new Blob([content]).size,lines:content.split("\n").length,chars:content.length,isFavorite:false,isTrashed:false,trashedAt:null,createdAt:Date.now(),updatedAt:Date.now()});
async function addFile(name,content,folderId){const f=mk(name,content,folderId);await dbPut("files",f);files.push(f);log("activity","File dibuat",name);return f}
async function updFile(f,patch){Object.assign(f,patch,{updatedAt:Date.now()});await dbPut("files",f)}
function exportFile(f){const b=new Blob([f.content],{type:"text/html"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
 if(ST.remember){ST.lastFolder=f.folderId;saveST()}log("save","Diekspor",f.name);toast("Diunduh")}
const targetFolder=()=>ST.remember&&ST.lastFolder&&folders.some(x=>x.id===ST.lastFolder)?ST.lastFolder:S.folder;
async function importList(list){let n=0;const target=targetFolder();
 for(const f of list){if(!/\.html?$/i.test(f.name))continue;try{await addFile(uniq(f.name,target),await f.text(),target);n++}catch(e){log("error",e&&e.message||e,f.name)}}
 toast(n?n+" file diimpor":"Tidak ada file .html",n?"":"e");renderList()}
function moveSheet(f){const list=[{id:null,n:"Root (luar folder)"}];folders.forEach(fd=>{if(fd.id!==f.folderId)list.push({id:fd.id,n:"/"+path(fd.id).join("/")})});
 if(f.folderId===null&&list.length<2){toast("Tidak ada folder tujuan lain");return}if(f.folderId===null)list.shift();
 sheet("Pindah file ke…",f.name,list.map(x=>({l:x.n,i:"folder",fn:async()=>{await moveFiles([f.id],x.id)}})))}
async function moveFiles(ids,pid){let n=0;for(const id of ids){const f=gf(id);if(!f)continue;const nn=uniq(f.name,pid,f.id);await updFile(f,{folderId:pid,name:nn});log("activity","Dipindah ke "+(pid?"/"+path(pid).join("/"):"Root"),nn);n++}exitSel();renderList();toast(n>1?n+" file dipindah":"Dipindah")}
async function trashFiles(ids){for(const id of ids){const f=gf(id);if(!f)continue;await updFile(f,{isTrashed:true,trashedAt:Date.now()});log("activity","Dipindah ke Trash",f.name);if(S.openId===f.id)S.openId=null}exitSel();renderList();toast(ids.length>1?ids.length+" file ke Trash":"Dipindah ke Trash")}
function fileSheet(f){sheet(f.name,kb(f.size)+" · "+f.lines+" baris · "+dt(f.updatedAt),[
 {l:"Open",i:"eye",fn:()=>openFile(f.id)},
 {l:"Pindah ke folder…",i:"folder",fn:()=>moveSheet(f)},
 {l:"Ubah nama",i:"edit",fn:async()=>{const n=await modal("Ubah nama",{input:1,val:f.name,ok:"Simpan",validate:v=>nameErr(v,f.folderId,f.id)});if(n){const old=f.name;await updFile(f,{name:n});log("activity","Nama diubah: "+old+" → "+n,n);renderList()}}},
 {l:"Save / Export",i:"down",fn:()=>exportFile(f)},
 {l:"Duplikat",i:"copy",fn:async()=>{await addFile(uniq(f.name.replace(/(\.html?)?$/i," (salinan)$1"),f.folderId),f.content,f.folderId);renderList();toast("Diduplikat")}},
 {l:f.isFavorite?"Hapus favorit":"Favorit",i:"star",fn:async()=>{await updFile(f,{isFavorite:!f.isFavorite});log("activity",f.isFavorite?"Difavoritkan":"Favorit dilepas",f.name);renderList()}},
 {l:"Pilih banyak",i:"sel",fn:()=>enterSel(f.id)},
 {l:"Info file",i:"info",fn:()=>modal("Info file",{msg:f.name+"\n"+kb(f.size)+" · "+f.lines+" baris · "+f.chars+" karakter\nDibuat "+dt(f.createdAt)+"\nDiubah "+dt(f.updatedAt)+"\nFolder: /"+path(f.folderId).join("/"),ok:"Tutup",cancel:false})},

function bmFindAnchor(text,needle){if(!needle)return null;var idx=text.indexOf(needle);if(idx!==-1)return{index:idx,length:needle.length,variant:'exact'};var v2=needle.replace(/^[ \t]+/,'');if(v2&&v2!==needle){var i2=text.indexOf(v2);if(i2!==-1&&text.indexOf(v2,i2+1)===-1)return{index:i2,length:v2.length,variant:'trimStart'}}var v3=needle.replace(/^[ \t]+/gm,'');if(v3&&v3!==needle&&v3!==v2){var i3=text.indexOf(v3);if(i3!==-1&&text.indexOf(v3,i3+1)===-1)return{index:i3,length:v3.length,variant:'trimAll'}}return null}
function bmParsePairs(input){if(!input||!input.trim())return[];var pairs=[];var lines=input.replace(/\r\n?/g,'\n').split('\n');var current=null,mode=null,buf=[];
 function flush(){if(!current){buf=[];return}var text=buf.join('\n').replace(/^\n+|\n+$/g,'');if(mode==='find')current.find=text;else if(mode==='replace')current.replace=text;buf=[]}
 function pushCurrent(){flush();if(current&&(typeof current.find==='string'||typeof current.replace==='string'))pairs.push(current);current=null;mode=null;buf=[]}
 for(var i=0;i<lines.length;i++){var line=lines[i];
  line=line.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
  line=line.replace(/[\u201C\u201D]/g,'"').replace(/[\u2018\u2019]/g,"'").replace(/\u00A0/g,' ');
  var rawTrimmed=line.trim();if(/^-{3,}\s*$/.test(rawTrimmed)){pushCurrent();continue}
  var trimmed=line.trim().replace(/^[-*•>\s]+/,'').replace(/^[`*_]+/,'').replace(/[`*_\s]+$/,'').trim();
  if(/^CARI\s*:\s*$/i.test(trimmed)){pushCurrent();current={};mode='find';continue}
  if(/^GANTI\s+DENGAN\s*:\s*$/i.test(trimmed)||/^GANTI\s*:\s*$/i.test(trimmed)){flush();mode='replace';continue}
  if(/^#{1,6}\s/.test(trimmed)){pushCurrent();continue}if(/^Perubahan\s+\d+/i.test(trimmed)){pushCurrent();continue}
  if(/^(Fungsi|Lokasi|Catatan\s+penting|Catatan|Note|Notes)\s*:/i.test(trimmed)){pushCurrent();continue}
  if(mode)buf.push(line)}
 pushCurrent();return pairs}

function getPromptBatch(){try{var v=localStorage.getItem('vault_prompt_batch');return v||AI_PROMPT_BATCH_DEFAULT}catch(e){return AI_PROMPT_BATCH_DEFAULT}}
function setPromptBatch(v){try{localStorage.setItem('vault_prompt_batch',v)}catch(e){}}
function copyPromptBatchLegacy(t){try{var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);toast(ok?'Prompt AI dicopy ('+t.length+' char)':'Gagal copy',ok?'':'e')}catch(e){toast('Gagal copy','e')}}
function copyPromptBatch(){var t=getPromptBatch();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Prompt AI dicopy ('+t.length+' char)')).catch(()=>copyPromptBatchLegacy(t))}else copyPromptBatchLegacy(t)}
function openPromptEditor(){$('#pemd-ta').value=getPromptBatch();$('#pemd').classList.add('on')}
function closePromptEditor(){$('#pemd').classList.remove('on');var ta=$('#pemd-ta');if(document.activeElement===ta)ta.blur()}
(function(){var btn=$('#bm-prompt'),timer=null,wasLong=false;
 btn.addEventListener('pointerdown',()=>{wasLong=false;clearTimeout(timer);timer=setTimeout(()=>{timer=null;wasLong=true;try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}openPromptEditor()},500)});
 btn.addEventListener('pointerup',()=>{if(timer){clearTimeout(timer);timer=null}if(wasLong){wasLong=false;return}copyPromptBatch()});
 ['pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,()=>{clearTimeout(timer);timer=null;wasLong=false}));btn.addEventListener('contextmenu',e=>e.preventDefault());
 var m=$('#pemd');m.addEventListener('click',e=>{if(e.target===m)closePromptEditor()});$('#pemd-close').onclick=closePromptEditor;
 $('#pemd-reset').onclick=async()=>{if(!await modal('Kembalikan ke prompt default?',{ok:'Reset',danger:1}))return;$('#pemd-ta').value=AI_PROMPT_BATCH_DEFAULT;toast('Direset — tap Simpan untuk menyimpan')};
 $('#pemd-save').onclick=()=>{var v=$('#pemd-ta').value;if(!v.trim()){toast('Prompt kosong','e');return}setPromptBatch(v);toast('Prompt disimpan ('+v.length+' char)');closePromptEditor()}})();
